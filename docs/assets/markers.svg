<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 70" width="420" height="70" font-family="sans-serif">
  <rect width="420" height="70" rx="8" fill="#1c1c1e"/>
  <g transform="translate(40 30)">
    <circle r="13" fill="#3B82F6" stroke="#fff" stroke-width="3"/>
    <text y="4.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
    <text y="34" text-anchor="middle" font-size="12" fill="#ddd">moving</text>
  </g>
  <g transform="translate(150 30)">
    <circle r="13" fill="#F97316" stroke="#fff" stroke-width="3" stroke-dasharray="5 3"/>
    <text y="4.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
    <text y="34" text-anchor="middle" font-size="12" fill="#ddd">standing still</text>
  </g>
  <g transform="translate(270 30)">
    <circle r="13" fill="#10B981" fill-opacity="0.45" stroke="#fff" stroke-width="3" stroke-dasharray="5 3"/>
    <text y="4.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
    <text y="34" text-anchor="middle" font-size="12" fill="#ddd">held</text>
  </g>
  <g transform="translate(370 30)">
    <circle r="3.5" cx="-14" fill="#3B82F6" fill-opacity="0.15"/>
    <circle r="3.5" cx="-6" fill="#3B82F6" fill-opacity="0.25"/>
    <circle r="3.5" cx="2" fill="#3B82F6" fill-opacity="0.4"/>
    <text y="34" text-anchor="middle" font-size="12" fill="#ddd">trail</text>
  </g>
</svg>
